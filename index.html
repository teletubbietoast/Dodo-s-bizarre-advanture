<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brawler P2P Multiplayer</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1e1e24; color: #fff; margin: 0; padding: 20px; transition: background-color 0.2s; }
        h1, h2, h3 { color: #f1c40f; margin-top: 5px; }
        .container { max-width: 950px; margin: 0 auto; background: #2b2b36; padding: 20px; border-radius: 12px; position: relative; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        .screen { display: none; }
        .screen.active { display: block; }
        input, button, select { padding: 10px 15px; font-size: 16px; margin: 5px; border-radius: 6px; border: none; }
        button { background: #e74c3c; color: white; cursor: pointer; font-weight: bold; transition: background 0.2s, transform 0.1s; }
        button:hover { background: #c0392b; transform: scale(1.02); }
        .btn-kick { background: #95a5a6; padding: 4px 8px; font-size: 12px; margin-left: 10px; }
        .btn-kick:hover { background: #7f8c8d; }
        
        .settings-box { background: #1e1e24; border: 1px solid #555; padding: 15px; border-radius: 8px; margin: 15px 0; }
        .settings-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-top: 10px; }

        .stats-dashboard { background: #1e1e24; border: 2px solid #f1c40f; padding: 15px; border-radius: 8px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .stat-box { background: #3a3a4c; padding: 8px 12px; border-radius: 6px; font-weight: bold; border: 1px solid #555; }
        
        .players-grid { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 15px; }
        .player-card { background: #3a3a4c; padding: 12px 16px; border-radius: 8px; cursor: pointer; flex: 1; min-width: 160px; border: 3px solid #555; position: relative; transition: all 0.3s ease; }
        .player-card:hover { border-color: #f1c40f; }
        .player-card.dead { opacity: 0.35; background: #1a1a20; text-decoration: line-through; border-color: #333; }
        .player-card.active-turn { border-color: #e74c3c; box-shadow: 0 0 15px #e74c3c; animation: turnPulse 1.5s infinite alternate; }
        @keyframes turnPulse { 0% { box-shadow: 0 0 8px #e74c3c; } 100% { box-shadow: 0 0 20px #e74c3c, 0 0 30px #f39c12; } }
        
        .turn-badge { display: none; background: #e74c3c; color: #fff; font-size: 11px; font-weight: bold; padding: 2px 6px; border-radius: 4px; position: absolute; top: -10px; right: 10px; text-transform: uppercase; }
        .active-turn .turn-badge { display: block; }

        .round-banner { display: none; padding: 15px; border-radius: 8px; text-align: center; font-size: 22px; font-weight: bold; margin-bottom: 15px; animation: popIn 0.4s ease; }
        .round-banner.win { background: #27ae60; color: #fff; border: 2px solid #2ecc71; }
        .round-banner.lose { background: #c0392b; color: #fff; border: 2px solid #e74c3c; }
        @keyframes popIn { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

        .card-selection { display: flex; gap: 15px; margin-top: 15px; flex-wrap: wrap; }
        .game-card { background: #ecf0f1; color: #2c3e50; padding: 15px; border-radius: 10px; cursor: pointer; flex: 1; min-width: 180px; border: 4px solid #bdc3c7; transition: transform 0.2s, box-shadow 0.2s; position: relative; }
        .game-card:hover { transform: translateY(-5px); box-shadow: 0 8px 16px rgba(0,0,0,0.4); }
        .rarity-Common { border-color: #95a5a6; }
        .rarity-Uncommon { border-color: #2ecc71; }
        .rarity-Rare { border-color: #3498db; }
        .rarity-Legendary { border-color: #f1c40f; background: linear-gradient(135deg, #fff9e6 0%, #ffeaa7 100%); animation: legendaryGlow 2s infinite alternate; }
        @keyframes legendaryGlow { 0% { box-shadow: 0 0 10px #f1c40f; } 100% { box-shadow: 0 0 25px #f39c12; } }

        .dice-container { text-align: center; margin: 20px 0; display: none; }
        .dice { display: inline-block; width: 70px; height: 70px; background: #e74c3c; color: white; font-size: 32px; font-weight: bold; line-height: 70px; border-radius: 14px; border: 4px solid #fff; box-shadow: 0 6px 12px rgba(0,0,0,0.5); }
        .dice.crit { background: #f1c40f; color: #000; border-color: #f39c12; }
        .rolling { animation: spin 0.12s infinite linear; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .damage-pop { position: absolute; color: #ff4757; font-size: 40px; font-weight: 900; animation: floatUp 1.2s forwards; pointer-events: none; z-index: 99; text-shadow: 0 2px 4px #000; }
        .crit-pop { color: #f1c40f; font-size: 48px; text-shadow: 0 0 10px #e67e22; }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0) scale(0.8); } 50% { transform: translateY(-25px) scale(1.2); } 100% { opacity: 0; transform: translateY(-50px) scale(1); } }
        .flash-damage { background-color: #78281f !important; }
        .shake { animation: shakeScreen 0.3s ease-in-out; }
        @keyframes shakeScreen { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }

        .status-banner { background: #3a3a4c; border-left: 5px solid #f1c40f; padding: 12px; margin: 10px 0; border-radius: 4px; font-size: 18px; font-weight: bold; }
        .log { background: #15151a; padding: 10px; height: 120px; overflow-y: auto; font-family: monospace; margin-top: 15px; border-radius: 6px; border: 1px solid #333; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 100; }
        .modal-content { background: #2b2b36; padding: 20px; border-radius: 10px; max-width: 500px; width: 90%; border: 2px solid #555; }
        .modal-stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; background: #1e1e24; padding: 10px; border-radius: 6px; margin-bottom: 12px; }
    </style>
</head>
<body>

<div class="container" id="main-container">
    <h1>Brawler P2P Multiplayer</h1>

    <!-- 1. HOOFDMENU -->
    <div id="screen-menu" class="screen active">
        <h2>Hoofdmenu</h2>
        <p>Voer je naam in:</p>
        <input type="text" id="username" placeholder="Jouw Naam">
        <br><br>
        <button onclick="createHost()">Host Een Nieuwe Game</button>
        <hr style="border-color: #444;">
        <h3>Join een Host:</h3>
        <input type="text" id="join-code" placeholder="Voer Host Code in">
        <button onclick="joinGame()">Join Game</button>
    </div>

    <!-- 2. LOBBY & INSTELLINGEN -->
    <div id="screen-lobby" class="screen">
        <h2>Lobby Code: <span id="display-code" style="color:#f1c40f;"></span></h2>
        <p>Deel deze code met je vrienden om ze te laten joinen.</p>
        
        <h3>Spelers in Lobby:</h3>
        <div id="lobby-players" style="display:flex; gap:10px; flex-wrap:wrap;"></div>

        <div id="host-settings-area" class="settings-box" style="display:none;">
            <h3>⚙️ Game Instellingen</h3>
            <div class="settings-grid">
                <div>
                    <label>Aantal Wins tot Winst:</label><br>
                    <select id="setting-target-wins" onchange="updateSettings()">
                        <option value="3">3 Wins</option>
                        <option value="5" selected>5 Wins</option>
                        <option value="10">10 Wins</option>
                    </select>
                </div>
                <div>
                    <label>Wie kiest kaarten na ronde?</label><br>
                    <select id="setting-card-rule" onchange="updateSettings()">
                        <option value="losers" selected>Alleen Verliezers</option>
                        <option value="all">Alle Spelers</option>
                        <option value="winner">Alleen Winnaar</option>
                    </select>
                </div>
                <div>
                    <label>Aantal Kaartopties per Keuze:</label><br>
                    <select id="setting-card-count" onchange="updateSettings()">
                        <option value="2">2 Kaarten</option>
                        <option value="3" selected>3 Kaarten</option>
                        <option value="4">4 Kaarten</option>
                    </select>
                </div>
            </div>
        </div>

        <br>
        <div id="host-start-btn" style="display:none;">
            <button onclick="hostStartGame()">Start Game!</button>
        </div>
        <p id="client-wait-msg" style="display:none;">Wachten tot de host het spel start...</p>
    </div>

    <!-- 3. GAME SCHERM -->
    <div id="screen-game" class="screen">
        <div id="round-result-banner" class="round-banner"></div>

        <div class="stats-

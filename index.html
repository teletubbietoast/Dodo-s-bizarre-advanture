<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaarten & Dobbelstenen Brawler</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #2b2b2b; color: #fff; margin: 0; padding: 20px; }
        h1, h2, h3 { color: #f1c40f; }
        .container { display: flex; flex-direction: column; gap: 20px; max-width: 1000px; margin: 0 auto; }
        .players { display: flex; gap: 20px; justify-content: space-between; }
        .player-card { background: #333; padding: 15px; border-radius: 8px; flex: 1; border: 2px solid #555; }
        .player-card.active { border-color: #e74c3c; box-shadow: 0 0 15px #e74c3c; }
        .player-card.dead { opacity: 0.5; }
        .controls { background: #444; padding: 20px; border-radius: 8px; text-align: center; }
        .log { background: #111; padding: 15px; border-radius: 8px; height: 200px; overflow-y: auto; font-family: monospace; }
        button { background: #e74c3c; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 16px; margin: 5px; }
        button:hover { background: #c0392b; }
        button:disabled { background: #7f8c8d; cursor: not-allowed; }
        .card-selection { display: flex; gap: 15px; justify-content: center; margin-top: 10px; }
        .game-card { background: #ecf0f1; color: #2c3e50; padding: 15px; border-radius: 8px; cursor: pointer; flex: 1; text-align: left; border: 4px solid #bdc3c7; }
        .game-card:hover { transform: scale(1.05); }
        .rarity-Common { border-color: #95a5a6; }
        .rarity-Uncommon { border-color: #2ecc71; }
        .rarity-Rare { border-color: #3498db; }
        .rarity-Legendary { border-color: #f1c40f; }
        .variant-Blessed { box-shadow: 0 0 10px #f1c40f; }
        .variant-Cursed { box-shadow: 0 0 10px #8e44ad; }
    </style>
</head>
<body>

<div class="container">
    <h1>Brawler Game</h1>
    
    <div class="players" id="players-container">
        <!-- Spelers worden hier via JS gegenereerd -->
    </div>

    <div class="controls" id="controls">
        <h2 id="phase-title">Start Spel</h2>
        <div id="action-area">
            <button onclick="startGame()">Start Spel (Kies startkaarten)</button>
        </div>
    </div>

    <div class="log" id="log"></div>
</div>

<script>
    const BASE_STATS = { dmg: 1, atk: 0, hp: 5, def: 10 };
    let players = [
        { id: 0, name: "Speler 1", wins: 0, cards: [], currentHp: 0, alive: true, initiative: 0 },
        { id: 1, name: "Speler 2", wins: 0, cards: [], currentHp: 0, alive: true, initiative: 0 },
        { id: 2, name: "Speler 3", wins: 0, cards: [], currentHp: 0, alive: true, initiative: 0 }
    ];
    let currentPlayerIndex = 0; // Index in initiative order
    let initiativeOrder = [];
    let state = "SETUP"; // SETUP, CARD_PICK, ROUND_START, TURN, END_ROUND, END_GAME
    
    let cardPickQueue = []; // Houdt bij wie kaarten moet kiezen
    let currentChoices = [];

    function logMsg(msg) {
        const log = document.getElementById('log');
        log.innerHTML += `<div>> ${msg}</div>`;
        log.scrollTop = log.scrollHeight;
    }

    function rollD20() { return Math.floor(Math.random() * 20) + 1; }

    function getStats(player) {
        let stats = { ...BASE_STATS };
        // Simpele versie van buffs toepassen (flat buffs voor deze demo)
        player.cards.forEach(card => {
            for (let stat in card.buffs) {
                stats[stat] += card.buffs[stat];
            }
            for (let stat in card.debuffs) {
                stats[stat] += card.debuffs[stat];
            }
        });
        
        // Limits
        stats.dmg = Math.max(0, stats.dmg);
        stats.hp = Math.max(0, Math.floor(stats.hp));
        stats.def = Math.max(0, stats.def);
        // atk mag negatief zijn
        return stats;
    }

    function updateUI() {
        const container = document.getElementById('players-container');
        container.innerHTML = '';
        players.forEach(p => {
            const stats = getStats(p);
            let isActive = (state === "TURN" && initiativeOrder.length > 0 && initiativeOrder[currentPlayerIndex].id === p.id);
            container.innerHTML += `
                <div class="player-card ${isActive ? 'active' : ''} ${!p.alive ? 'dead' : ''}">
                    <h3>${p.name} (Wins: ${p.wins}/5)</h3>
                    <p><strong>HP:</strong> ${p.currentHp} / ${stats.hp}</p>
                    <p>DMG: ${stats.dmg} | ATK: ${stats.atk > 0 ? '+'+stats.atk : stats.atk} | DEF: ${stats.def}</p>
                    <p><em>Kaarten: ${p.cards.length}</em></p>
                </div>
            `;
        });
    }

    // --- KAARTEN GENERATOR ---
    function generateCard() {
        const randRarity = Math.random() * 100;
        let rarity = 'Common';
        if (randRarity > 95) rarity = 'Legendary';
        else if (randRarity > 80) rarity = 'Rare';
        else if (randRarity > 50) rarity = 'Uncommon';

        const randVariant = Math.random() * 100;
        let variant = 'None';
        if (rarity !== 'Legendary' && randVariant < 10) {
            variant = randVariant < 5 ? 'Blessed' : 'Cursed';
        }

        let card = { rarity, variant, buffs: {}, debuffs: {} };
        const statNames = ['dmg', 'atk', 'hp', 'def'];
        let chosenStat = statNames[Math.floor(Math.random() * statNames.length)];

        // Basis buffs
        if (rarity === 'Common') card.buffs[chosenStat] = (chosenStat === 'hp') ? 3 : 1;
        if (rarity === 'Uncommon') {
            card.buffs[chosenStat] = (chosenStat === 'hp') ? 5 : 2;
            let debuffStat = statNames[Math.floor(Math.random() * statNames.length)];
            card.debuffs[debuffStat] = -Math.ceil(card.buffs[chosenStat] / 2);
        }
        if (rarity === 'Rare') {
            card.buffs[chosenStat] = (chosenStat === 'hp') ? 8 : 5;
            let debuffStat = statNames[Math.floor(Math.random() * statNames.length)];
            card.debuffs[debuffStat] = -Math.ceil(card.buffs[chosenStat] / 2);
        }
        if (rarity === 'Legendary') {
            card.buffs[chosenStat] = (chosenStat === 'hp') ? 15 : 8;
            let debuffStat = statNames[Math.floor(Math.random() * statNames.length)];
            card.debuffs[debuffStat] = -Math.ceil(card.buffs[chosenStat] / 2);
        }

        // Variants toepassen
        if (variant === 'Blessed') {
            for (let s in card.buffs) card.buffs[s] = Math.ceil(card.buffs[s] * 1.5);
        }
        if (variant === 'Cursed') {
            for (let s in card.buffs) card.buffs[s] *= 2;
            for (let s in card.debuffs) card.debuffs[s] *= 2;
            if (Object.keys(card.debuffs).length === 0) {
                let dStat = statNames[Math.floor(Math.random() * statNames.length)];
                card.debuffs[dStat] = -2;
            }
        }

        return card;
    }

    // --- GAME FLOW ---
    function startGame() {
        logMsg("Spel gestart! Iedereen mag een startkaart kiezen.");
        cardPickQueue = players.map(p => p.id);
        startCardPicking();
    }

    function startCardPicking() {
        state = "CARD_PICK";
        if (cardPickQueue.length === 0) {
            startRound();
            return;
        }
        let pId = cardPickQueue[0];
        let pName = players.find(p => p.id === pId).name;
        
        currentChoices = [generateCard(), generateCard(), generateCard()];
        
        document.getElementById('phase-title').innerText = `${pName} - Kies een kaart`;
        
        let html = `<div class="card-selection">`;
        currentChoices.forEach((c, idx) => {
            let bText = Object.entries(c.buffs).map(([k, v]) => `+${v} ${k}`).join(', ');
            let dText = Object.entries(c.debuffs).map(([k, v]) => `${v} ${k}`).join(', ');
            html += `<div class="game-card rarity-${c.rarity} variant-${c.variant}" onclick="pickCard(${idx})">
                        <strong>${c.rarity}</strong> ${c.variant !== 'None' ? `(${c.variant})` : ''}<br>
                        <span style="color:green">${bText}</span><br>
                        <span style="color:red">${dText}</span>
                     </div>`;
        });
        html += `</div>`;
        document.getElementById('action-area').innerHTML = html;
        updateUI();
    }

    window.pickCard = function(index) {
        let pId = cardPickQueue.shift();
        let player = players.find(p => p.id === pId);
        player.cards.push(currentChoices[index]);
        logMsg(`${player.name} heeft een ${currentChoices[index].rarity} kaart gekozen.`);
        startCardPicking(); // Volgende in de rij
    }

    function startRound() {
        state = "ROUND_START";
        logMsg("--- NIEUWE RONDE ---");
        
        // Restore HP
        players.forEach(p => {
            let stats = getStats(p);
            p.currentHp = stats.hp;
            p.alive = p.currentHp > 0;
            
            // Roll initiative, reroll ties logic is simplified here to avoid infinite loops, adding minor decimals to tiebreak
            p.initiative = rollD20() + (Math.random() * 0.1); 
        });

        initiativeOrder = [...players].filter(p => p.alive).sort((a, b) => b.initiative - a.initiative);
        logMsg("Initiative gerold: " + initiativeOrder.map(p => p.name).join(' ➔ '));
        
        currentPlayerIndex = 0;
        playTurn();
    }

    function playTurn() {
        state = "TURN";
        if (checkRoundEnd()) return;

        let activePlayer = initiativeOrder[currentPlayerIndex];
        if (!activePlayer.alive) {
            nextTurn();
            return;
        }

        document.getElementById('phase-title').innerText = `Beurt van ${activePlayer.name}`;
        
        let html = `<p>Kies wie je wilt aanvallen:</p>`;
        players.forEach(target => {
            if (target.id !== activePlayer.id && target.alive) {
                html += `<button onclick="attack(${activePlayer.id}, ${target.id})">Val ${target.name} aan</button>`;
            }
        });
        document.getElementById('action-area').innerHTML = html;
        updateUI();
    }

    window.attack = function(attackerId, targetId) {
        let attacker = players.find(p => p.id === attackerId);
        let target = players.find(p => p.id === targetId);
        
        let aStats = getStats(attacker);
        let tStats = getStats(target);
        
        let roll = rollD20();
        let attackTotal = roll + aStats.atk;
        
        logMsg(`${attacker.name} rolt ${roll} + ${aStats.atk} = ${attackTotal} tegen de DEF (${tStats.def}) van ${target.name}.`);
        
        if (attackTotal >= tStats.def) {
            target.currentHp -= aStats.dmg;
            logMsg(`-> RAAK! ${target.name} verliest ${aStats.dmg} HP.`);
            if (target.currentHp <= 0) {
                target.alive = false;
                logMsg(`💀 ${target.name} is dood voor deze ronde!`);
            }
        } else {
            logMsg(`-> MISS!`);
        }
        
        nextTurn();
    }

    function nextTurn() {
        currentPlayerIndex++;
        if (currentPlayerIndex >= initiativeOrder.length) {
            currentPlayerIndex = 0; // Terug naar het begin van de beurten
        }
        playTurn();
    }

    function checkRoundEnd() {
        let alivePlayers = players.filter(p => p.alive);
        if (alivePlayers.length <= 1) {
            let winner = alivePlayers[0];
            if(winner) {
                winner.wins++;
                logMsg(`🏆 ${winner.name} WINT de ronde!`);
                
                if (winner.wins >= 5) {
                    logMsg(`🎉🎉 ${winner.name} HEEFT HET SPEL GEWONNEN! 🎉🎉`);
                    document.getElementById('action-area').innerHTML = `<button onclick="location.reload()">Speel Opnieuw</button>`;
                    return true;
                }
                
                // Verliezers krijgen kaarten
                cardPickQueue = players.filter(p => p.id !== winner.id).map(p => p.id);
            } else {
                logMsg(`Gelijkspel, iedereen is dood!`);
                cardPickQueue = players.map(p => p.id);
            }
            startCardPicking(); // Start de pick-fase, die leidt naar de volgende ronde
            return true;
        }
        return false;
    }

    updateUI();
</script>

</body>
</html>
